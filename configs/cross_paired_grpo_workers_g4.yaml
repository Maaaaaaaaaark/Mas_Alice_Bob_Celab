# Stage 1 G=4 pilot: frozen C, shared trainable worker LoRA.
# Kept separate from the G=6 pilot so checkpoints and metrics never mix.

experiment_id: cross_paired_grpo_workers
experiment_version: pilot_g4
seed: 0
output_dir: outputs/training
manifest_dir: outputs/training_manifests/pilot_g4
prompt_dir: prompts_training

data:
  dataset: hotpot_qa
  dataset_config: distractor
  train:
    split: train
    num_questions: 500
    selection_seed: 0
  val:
    split: validation
    num_questions: 64
    selection_seed: 1
  test:
    split: validation
    num_questions: 64
    selection_seed: 2
  partition_seed: 0
  val_test_split_seed: 0

model:
  name: google/gemma-3-1b-it
  revision: null
  dtype: float16
  device: cuda
  attn_implementation: null
  max_input_length: 30000
  peft:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules: null

workers:
  G: 4
  delta: 0.05
  eps_n: 1.0e-6
  clip_epsilon: 0.2
  num_policy_epochs: 1
  minibatch_size: 1
  max_sampling_attempts: 200
  learning_rate: 1.0e-4
  weight_decay: 0.0
  questions_per_update: 4
  steps: 10
  eval_interval: 1
  step0_eval: true
  final_test_eval: true
  fail_on_insufficient_signal: false
  rollout:
    do_sample: true
    temperature: 0.6
    top_p: 1.0
    max_new_tokens: 256
  eval_decode:
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 256
  synthesizer_decode:
    do_sample: false
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 64

modes:
  pilot:
    experiment_version: pilot_g4
    manifest_dir: outputs/training_manifests/pilot_g4
